# isp.solforbs.com — the ISP platform.
#
# Shares the box with mail, panel and sms, so this file adds a server block and touches
# nothing else. It follows the shape those sites already use: a redirect on 80, the site on
# 443, and the shared PHP-FPM pool.

server {
    listen 80;
    listen [::]:80;

    server_name isp.solforbs.com;

    # Certbot renews over HTTP, so the challenge path is answered rather than redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://isp.solforbs.com$request_uri;
    }
}

server {
    # The `http2 on;` directive is 1.25+; this box runs nginx 1.24, where http2 is a
    # parameter of listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name isp.solforbs.com;

    root /var/www/isp/public;
    index index.php;

    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/isp.solforbs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isp.solforbs.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # M-PESA and Paystack post callbacks here; a body larger than this is not one of ours.
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite fingerprints its output, so it can be cached hard.
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_PROXY "";

        # Provisioning runs while a customer waits at the portal, but a router that has gone
        # away must not hold a worker open indefinitely.
        fastcgi_read_timeout 60;
    }

    # Anything dot-prefixed, .env above all, is never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/isp.access.log;
    error_log  /var/log/nginx/isp.error.log;
}
